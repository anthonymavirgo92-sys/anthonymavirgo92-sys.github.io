<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anto Nutrición</title>
<meta name="description" content="Plan de alimentación saludable para resistencia a la insulina y obesidad: láminas por día, control diario, bebidas sin azúcar y análisis de fotos.">
<meta name="theme-color" content="#0E7C78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anto Nutrición">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app móvil de una columna (máx. 980px) con barra de pestañas fija abajo */
:root{
  --bg:#EEF6F5; --surface:#FFFFFF; --surface-2:#E2EFED; --ink:#11272A; --muted:#527175; --line:#CFE1DF;
  --accent:#0E7C78; --accent-ink:#FFFFFF; --accent-soft:#D2EEEB; --sun:#D9822B; --sun-soft:#FCEBDA;
  --ok:#2E8B57; --warn:#B87A0C; --bad:#BF3F28; --bad-soft:#F8DED7; --warn-soft:#FBEFD2; --ok-soft:#DDF1E4;
  --water:#3E95CF; --water-soft:#DCEEF9;
  --z-v:#CDE7C6; --z-p:#F5D3C3; --z-c:#F1E3B6; --z-g:#DCE7B0; --z-f:#EBD5EF; --plate:#FFFFFF; --rim:#D6E5E3;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:16px; --nav-h:66px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0B1719; --surface:#132427; --surface-2:#1A2F32; --ink:#E2F0EF; --muted:#92B0B1; --line:#25403F;
  --accent:#4FC4BC; --accent-ink:#04201E; --accent-soft:#163B39; --sun:#F0A35A; --sun-soft:#3D2A17;
  --ok:#62C48C; --warn:#E3A93E; --bad:#EE7A62; --bad-soft:#3E211B; --warn-soft:#3A2E14; --ok-soft:#1B3A2A;
  --water:#6CB8EA; --water-soft:#16303F;
  --z-v:#27462C; --z-p:#553226; --z-c:#524625; --z-g:#3D4A22; --z-f:#462F4C; --plate:#1B2C2F; --rim:#2C4446;
  color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));overscroll-behavior-y:contain}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.7rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
a{color:var(--accent);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:76px;resize:vertical}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 12px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.water{background:var(--water-soft);color:var(--water)}

/* Encabezado */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:16px;margin-inline:-16px;padding-inline:16px}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:36px;height:36px;border-radius:10px;flex:none}
.brand b{font-family:var(--f-display);font-size:1.2rem;font-weight:800}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.1rem;display:grid;place-items:center;flex:none}

/* Pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr);height:var(--nav-h)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;font-weight:700;color:var(--muted);position:relative}
nav.tabs button .ic{font-size:1.3rem;line-height:1;transition:transform .2s}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"] .ic{transform:translateY(-2px) scale(1.12)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
section.view{animation:rise .28s ease-out}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.pop{animation:pop .3s}

/* Hoy */
.daybar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.daybar .mid{text-align:center;min-width:0}
.daybar .mid h1{text-transform:capitalize}
.summary{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:96px;height:96px}
.ring .arc{transition:stroke-dashoffset .6s ease}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.stats div{min-width:0}
.stats b{font-family:var(--f-display);font-size:1.15rem;display:block}
.meal{display:grid;gap:10px}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;font-size:.8rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .15s,transform .12s}
.seg button:active{transform:scale(.95)}
.seg button .s{font-size:1.05rem}
.seg button[aria-pressed="true"][data-v="si"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"][data-v="parcial"],.seg button[aria-pressed="true"][data-v="cambio"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.seg button[aria-pressed="true"][data-v="no"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.84rem;font-weight:600;transition:background .15s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.glasses{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:36px;height:46px;border:0;background:none;padding:0}
.glass svg{width:100%;height:100%}
.glass .w{fill:var(--surface-2);transition:fill .25s} .glass[aria-pressed="true"] .w{fill:var(--water)}
.glass .o{fill:none;stroke:var(--muted);stroke-width:2}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:600;color:var(--muted)}
.photo-mini{display:flex;gap:8px;align-items:center;font-size:.8rem}
.photo-mini img{width:38px;height:38px;object-fit:cover;border-radius:8px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);width:100%;text-align:left}
.switch .k{width:46px;height:28px;border-radius:99px;background:var(--surface-2);position:relative;flex:none;transition:background .2s}
.switch .k::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px #0003;transition:left .2s}
.switch[aria-pressed="true"] .k{background:var(--accent)}
.switch[aria-pressed="true"] .k::after{left:21px}
.welcome{background:var(--accent);color:var(--accent-ink);border:0}
.welcome .btn{background:var(--accent-ink);color:var(--accent);border:0}

/* Láminas */
.daypick{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.daypick button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:700;font-size:.85rem}
.daypick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lamina-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lamina-head h1{font-size:2.3rem}
.macros{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.macro{background:var(--surface-2);border-radius:12px;padding:8px 10px;min-width:0}
.macro b{font-family:var(--f-display);font-size:1.1rem;display:block}
.macro span{font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.plate-row{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:18px;align-items:center}
.plate-row svg{width:100%;height:auto;max-width:100%}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.items li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:baseline}
.items li .e{font-size:1.15rem}
.items li .k{font-size:.78rem;color:var(--muted)}
.zone-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.time{font-size:.78rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px}
.note{background:var(--sun-soft);border-radius:12px;padding:10px 12px;font-size:.88rem}
.opts{display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.swipehint{font-size:.78rem;color:var(--muted);text-align:center}
svg .zv{fill:var(--z-v)} svg .zp{fill:var(--z-p)} svg .zc{fill:var(--z-c)} svg .zg{fill:var(--z-g)} svg .zf{fill:var(--z-f)}
svg .plate{fill:var(--plate);stroke:var(--rim);stroke-width:6} svg .sep{stroke:var(--plate);stroke-width:3}
svg .cup{fill:var(--surface-2);stroke:var(--rim);stroke-width:3}

/* Bebidas */
.hero-beb{background:linear-gradient(160deg,var(--water-soft),var(--surface));border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:14px}
.streak{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.streak div{background:var(--surface);border-radius:14px;padding:10px;text-align:center}
.streak b{display:block;font-family:var(--f-display);font-size:1.8rem;line-height:1.1}
.cubes{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.cube{width:18px;height:18px;border-radius:4px;background:var(--surface);border:2px solid var(--muted);animation:drop .4s backwards}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.compare>div{background:var(--surface);border-radius:14px;padding:12px;display:grid;gap:8px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.bcard .art{height:118px;display:grid;place-items:center;font-size:3.2rem;position:relative}
.bcard .art .bub{position:absolute;bottom:-8px;width:8px;height:8px;border-radius:50%;background:#fff8;animation:bub 2.6s infinite ease-in}
@keyframes bub{to{transform:translateY(-120px);opacity:0}}
.bcard .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.bcard .meta{display:flex;gap:6px;flex-wrap:wrap}
.bcard .acts{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.fav{background:none;border:0;font-size:1.3rem;padding:4px}
.fav[aria-pressed="true"]{animation:pop .3s}
.cat-gas{background:linear-gradient(180deg,#D5ECF8,#EEF8FD)} .cat-limon{background:linear-gradient(180deg,#F3F2BE,#FBFBE6)} .cat-fruta{background:linear-gradient(180deg,#F8D6DA,#FDEEEF)} .cat-te{background:linear-gradient(180deg,#D7EBCF,#EEF7EA)} .cat-caliente{background:linear-gradient(180deg,#F1DCC6,#FAF0E6)}
@media (prefers-color-scheme: dark){.cat-gas{background:linear-gradient(180deg,#173445,#16221A)} .cat-limon{background:linear-gradient(180deg,#3A3A17,#16221A)} .cat-fruta{background:linear-gradient(180deg,#45222A,#16221A)} .cat-te{background:linear-gradient(180deg,#22401E,#16221A)} .cat-caliente{background:linear-gradient(180deg,#3F2C1A,#16221A)}}
.recipe-sheet ol,.recipe-sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.weeks div{background:var(--surface-2);border-radius:14px;padding:12px}
.weeks b{font-family:var(--f-display)}

/* Foto */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;cursor:pointer}
.drop img{max-height:280px;border-radius:12px;object-fit:cover}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:.85rem}
.bar .t{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:99px;transition:width .8s ease}
.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.hcard{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:start}
.hcard img{width:72px;height:72px;object-fit:cover;border-radius:10px}
.sem{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle}
.sem.verde{background:var(--ok)} .sem.amarillo{background:var(--warn)} .sem.rojo{background:var(--bad)}
.spinner{width:22px;height:22px;border:3px solid var(--surface-2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* Aprende */
.learn{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.learn .card h3{margin-bottom:6px}
.learn .card p+p{margin-top:6px}
.tri{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tri ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.hand{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.hand div{background:var(--surface-2);border-radius:12px;padding:10px}
.hand b{display:block;font-family:var(--f-display);font-size:1.6rem}
.answer{white-space:pre-wrap;background:var(--surface-2);border-radius:12px;padding:12px;font-size:.92rem}
details.recipe{border-top:1px solid var(--line);padding-block:10px}
details.recipe summary{font-weight:700;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpis div{background:var(--surface-2);border-radius:12px;padding:12px}
.kpis b{display:block;font-family:var(--f-display);font-size:1.5rem}

/* Avance */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem;min-width:640px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td:first-child,th:first-child{text-align:left}
.chart svg{width:100%;height:auto}
.chart .ax{stroke:var(--line)} .chart .ln{stroke:var(--accent);fill:none;stroke-width:2.5} .chart .ar{fill:var(--accent-soft)} .chart .pt{fill:var(--accent)} .chart text{fill:var(--muted);font:500 11px var(--f-body)}

/* Hojas (dialog) */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:640px;max-height:92vh;border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink)}
dialog.sheet::backdrop{background:#0008}
dialog.sheet[open]{animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.sheet-in{padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:92vh}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.88rem;z-index:30;animation:rise .2s}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:40}

@media (max-width:640px){
  h1{font-size:1.45rem}
  .lamina-head h1{font-size:1.9rem}
  .plate-row{grid-template-columns:1fr}
  .plate-row svg{max-width:300px;margin:0 auto;display:block}
  .macros{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bar{grid-template-columns:92px 1fr 62px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><img src="icons/icon-192.png" alt=""><b>Anto Nutrición</b></div>
    <div class="row" style="gap:8px;flex-wrap:nowrap">
      <button class="btn sm primary" id="install" hidden>Instalar</button>
      <button class="iconbtn" id="share" aria-label="Compartir la app">📤</button>
      <button class="iconbtn" id="perfil-btn" aria-label="Mi perfil y ajustes">👤</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="v-hoy" class="stack view"></section>
  <section id="v-semana" class="stack view" hidden></section>
  <section id="v-bebidas" class="stack view" hidden></section>
  <section id="v-foto" class="stack view" hidden></section>
  <section id="v-aprende" class="stack view" hidden></section>
  <section id="v-avance" class="stack view" hidden></section>
</main>

<nav class="tabs" aria-label="Secciones">
  <div class="wrap">
    <button data-tab="hoy" aria-current="page"><span class="ic">✅</span>Hoy</button>
    <button data-tab="semana"><span class="ic">🍽️</span>Semana</button>
    <button data-tab="bebidas"><span class="ic">🧊</span>Bebidas</button>
    <button data-tab="foto"><span class="ic">📷</span>Foto IA</button>
    <button data-tab="aprende"><span class="ic">📘</span>Aprende</button>
    <button data-tab="avance"><span class="ic">📈</span>Avance</button>
  </div>
</nav>

<dialog class="sheet" id="sheet"><div class="sheet-in" id="sheet-in"></div></dialog>
<div id="toast" class="toast" hidden></div>
<canvas id="fx" hidden></canvas>

<script>
/* ============================================================
   DATOS DEL PLAN (Régimen 1 de la clínica)
   N = [kcal, proteína g, carbohidratos g, grasa g, fibra g], estimados

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

function lsGet(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }

function mealFor(dayData, k, dIdx, opts){
  if (k==='mm' || k==='tarde'){
    if (dayData.n==='Día depurativo') return dayData[k];

}
const mealText = m => m.text || [...m.items, ...(m.side||[])].map(i=>i.t).join(' + ');
function saveFile(name, content, type){

/* Confeti al completar el día */
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#fx'), x = c.getContext('2d'); c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const cols = ['#0E7C78','#C98512','#3E95CF','#BF3F28','#8DC77B'];
  const ps = Array.from({length:110},()=>({x:innerWidth/2, y:innerHeight/2.6, vx:(Math.random()-.5)*12, vy:Math.random()*-12-3, s:Math.random()*6+4, c:cols[Math.random()*cols.length|0], r:Math.random()*6}));
  let f = 0; (function tick(){ x.clearRect(0,0,c.width,c.height); ps.forEach(p=>{ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.r+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); x.restore(); }); if (++f<90) requestAnimationFrame(tick); else c.hidden = true; })();
}

/* ============================================================
   PLATO ILUSTRADO (SVG)
   ============================================================ */
const WEIGHT = {v:2, p:1.15, c:1, g:.45, f:1};
function plateSVG(meal){
  const items = meal.items, side = meal.side||[];
  const zones = ['v','p','c','g','f'].map(z => ({z, its: items.filter(i=>i.z===z)})).filter(o=>o.its.length);
  const tot = zones.reduce((a,o)=>a+WEIGHT[o.z],0);
  const W = side.length ? 270 : 210, cx=105, cy=105, R=86;
  let a = -Math.PI/2, out = `<svg viewBox="0 0 ${W} 210" role="img" aria-label="Plato modelo">`;
  out += `<circle class="plate" cx="${cx}" cy="${cy}" r="${R+10}"/>`;
  const emo = [];
  zones.forEach(o => {
    const frac = WEIGHT[o.z]/tot, a1 = a + frac*2*Math.PI;
    if (zones.length===1) out += `<circle class="${ZONES[o.z].c}" cx="${cx}" cy="${cy}" r="${R}"/>`;
    else {
      const x0=cx+R*Math.cos(a), y0=cy+R*Math.sin(a), x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
      out += `<path class="${ZONES[o.z].c}" d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${frac>.5?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z"/>`;
    }
    const ems = o.its.flatMap(i=>i.p).slice(0,6), n = ems.length, span = (a1-a)*0.62, am=(a+a1)/2;
    const size = frac < .16 ? 19 : 25;
    ems.forEach((e,i) => {
      let ang, rad;
      if (zones.length===1){ ang = -Math.PI/2 + i*2*Math.PI/n; rad = n===1?0:45; }
      else if (n<=3){ ang = n===1?am: am - span/2 + span*i/(n-1); rad = frac<.16?62:(n===1?52:56); }
      else { const ring = i%2, k = Math.floor(i/2), m = Math.ceil(n/2); ang = m===1?am: am - span/2 + span*k/(m-1); rad = ring? 34: 64; }
      emo.push(`<text x="${(cx+rad*Math.cos(ang)).toFixed(1)}" y="${(cy+rad*Math.sin(ang)).toFixed(1)}" font-size="${size}" text-anchor="middle" dominant-baseline="central">${e}</text>`);
    });
    a = a1;
  });
  if (zones.length>1){ let b=-Math.PI/2; zones.forEach(o=>{ out+=`<line class="sep" x1="${cx}" y1="${cy}" x2="${(cx+R*Math.cos(b)).toFixed(1)}" y2="${(cy+R*Math.sin(b)).toFixed(1)}"/>`; b+=WEIGHT[o.z]/tot*2*Math.PI; }); }
  out += emo.join('');
  side.forEach((s,i) => { const y = 60 + i*80; out += `<circle class="cup" cx="236" cy="${y}" r="28"/><text x="236" y="${y}" font-size="28" text-anchor="middle" dominant-baseline="central">${s.e}</text>`; });
  return out + '</svg>';
}

const S = { dias: lsGet('np.dias',{}), fotos: [], perfil: lsGet('np.perfil',{}), favs: lsGet('np.favs',[]), timer:null };
const IDB = {
  db:null,
  open(){ return this.db ? Promise.resolve(this.db) : new Promise((res,rej)=>{ const r=indexedDB.open('nutriplan',1); r.onupgradeneeded=()=>r.result.createObjectStore('fotos',{keyPath:'id'}); r.onsuccess=()=>res(this.db=r.result); r.onerror=()=>rej(r.error); }); },
  async tx(mode, fn){ const db = await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('fotos',mode), st=t.objectStore('fotos'); const out = fn(st); t.oncomplete=()=>res(out && out.result); t.onerror=()=>rej(t.error); }); },
  all(){ return this.tx('readonly', st => st.getAll()); },
  put(f){ return this.tx('readwrite', st => st.put(f)); },
  del(id){ return this.tx('readwrite', st => st.delete(id)); }
};
async function loadFotos(){ try{ S.fotos = (await IDB.all()||[]).sort((a,b)=>b.ts-a.ts); }catch(e){ S.fotos = lsGet('np.fotos',[]); } }

async function deleteFoto(id){ try{ await IDB.del(id); }catch(e){ lsSet('np.fotos', lsGet('np.fotos',[]).filter(f=>f.id!==id)); } S.fotos = S.fotos.filter(f=>f.id!==id); }

function patchDay(date, fn, rerender){
  const d = JSON.parse(JSON.stringify(getDay(date)));
  const before = dayScore(d).comidas;
  fn(d); d.fecha = date; d.updatedAt = Date.now();
  S.dias[date] = d;
  clearTimeout(S.timer); S.timer = setTimeout(()=>{ if (!lsSet('np.dias', S.dias)) toast('El teléfono no tiene espacio para guardar'); }, 300);

  const body = {contents:[{role:'user', parts}], generationConfig:{temperature:0.4, ...(json?{responseMimeType:'application/json'}:{})}};
  let lastErr = 'No se pudo conectar. Revisa tu internet.';
  for (const m of MODELS){
    let r;
    try { r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, {method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':key}, body:JSON.stringify(body)}); }
    catch(e){ throw new Error('Sin conexión a internet. Intenta de nuevo.'); }
    if (r.status===404) { lastErr = 'Modelo no disponible'; continue; }
    const data = await r.json().catch(()=>({}));
    if (!r.ok){
      if (r.status===400 && /API key/i.test(JSON.stringify(data))) throw new Error('La clave no es válida. Cópiala de nuevo desde Google AI Studio.');
      if (r.status===403) throw new Error('La clave no tiene permiso. Crea una nueva en Google AI Studio.');
      if (r.status===429) throw new Error('Llegaste al límite gratis por ahora. Intenta en unos minutos.');
      lastErr = 'El servicio no respondió (error '+r.status+'). Intenta otra vez.'; continue;
    }
    const text = (data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
    if (!text) { lastErr = 'No hubo respuesta. Prueba con otra foto.'; continue; }
    if (!json) return text;
    try { return JSON.parse(text); } catch(e){ const m2 = text.match(/\{[\s\S]*\}/); if (m2) try { return JSON.parse(m2[0]); } catch(_){} lastErr = 'La respuesta llegó incompleta. Toca analizar otra vez.'; }
  }
  throw new Error(lastErr);
}

function imgTo(file, max, q){
  return new Promise((res) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',q)); };
    img.onerror = () => res(null); img.src = u;
  });
}

  </div>

const ST_SYM = {si:'✓', parcial:'½', cambio:'↺', no:'✕'};
const diasOrdenados = () => Object.keys(S.dias).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
function weightChart(){
  const p = S.perfil, base = p.pesoIni ? [{f:p.fechaIni||diasOrdenados()[0]||iso(new Date()), w:+p.pesoIni}] : [];
  const pts = [...base, ...diasOrdenados().filter(k=>S.dias[k].peso).map(k=>({f:k,w:+S.dias[k].peso}))].sort((a,b)=>a.f<b.f?-1:1);
  if (pts.length<2) return `<p class="muted">Registra tu peso en <b>Hoy</b> (una vez por semana, en ayunas) y aquí verás tu curva${p.pesoIni?' desde tus '+esc(p.pesoIni)+' kg iniciales':''}.</p>`;
  const W=640,H=220,L=44,R=16,T=16,B=30;
  const t0=parseIso(pts[0].f).getTime(), t1=Math.max(parseIso(pts[pts.length-1].f).getTime(), t0+864e5);
  let lo=Math.floor(Math.min(...pts.map(q=>q.w))-1), hi=Math.ceil(Math.max(...pts.map(q=>q.w))+1);
  const x=f=>L+(parseIso(f).getTime()-t0)/(t1-t0)*(W-L-R), y=w=>T+(hi-w)/(hi-lo)*(H-T-B);
  const ticks=[]; const step=Math.max(1,Math.ceil((hi-lo)/4)); for(let v=lo; v<=hi; v+=step) ticks.push(v);
  const line=pts.map((q,i)=>(i?'L':'M')+x(q.f).toFixed(1)+' '+y(q.w).toFixed(1)).join(' ');
  const area=line+` L${x(pts[pts.length-1].f).toFixed(1)} ${H-B} L${x(pts[0].f).toFixed(1)} ${H-B} Z`;
  const last=pts[pts.length-1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso">
    ${ticks.map(v=>`<line class="ax" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('')}
    <path class="ar" d="${area}"/><path class="ln" d="${line}"/>
    ${pts.map(q=>`<circle class="pt" cx="${x(q.f)}" cy="${y(q.w)}" r="${q===last?5:3}"/>`).join('')}
    <text x="${L}" y="${H-8}">${esc(fmtShort(pts[0].f))}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${esc(fmtShort(last.f))}</text>
    <text x="${W-R}" y="${y(last.w)-10}" text-anchor="end" style="font-weight:700;fill:var(--ink)">${last.w} kg</text>
  </svg></div>`;
}
function renderAvance(){
  const ks = diasOrdenados(), last14 = Array.from({length:14},(_,i)=>addDays(iso(new Date()),-13+i));
  const pesos = ks.map(k=>S.dias[k]).filter(d=>d.peso); const ult = pesos.length? +pesos[pesos.length-1].peso : null;
  const ini = +S.perfil.pesoIni || null;
  const sem = last14.slice(7).map(k=>S.dias[k]).filter(Boolean);
  const adh = sem.length ? Math.round(sem.reduce((a,d)=>a+dayScore(d).comidas,0)/(sem.length*5)*100) : 0;
  const agua = sem.length ? (sem.reduce((a,d)=>a+(d.agua||0),0)/sem.length).toFixed(1) : '0';
  const act = sem.reduce((a,d)=>a+((d.actividad||0)>=30?1:0),0);
  $('#v-avance').innerHTML = `<div><div class="eyebrow">Avance</div><h1>Mi progreso</h1><p class="muted" style="margin-top:6px">Todo lo que marcas en <b>Hoy</b> y tus fotos se juntan aquí. Descarga el reporte para tu control.</p></div>
  <div class="kpis num">
    <div><span class="small muted">Peso actual</span><b>${ult??ini??'—'} ${ult||ini?'kg':''}</b><span class="small muted">${ult&&ini?((ult-ini)<=0?'':'+')+(ult-ini).toFixed(1)+' kg desde el inicio':'registra tu peso en Hoy'}</span></div>
    <div><span class="small muted">Cumplimiento 7 días</span><b>${adh}%</b><span class="small muted">de comidas</span></div>
    <div><span class="small muted">Agua promedio</span><b>${agua}</b><span class="small muted">vasos al día</span></div>
    <div><span class="small muted">Días con 30+ min</span><b>${act}/7</b><span class="small muted">actividad física</span></div>
    <div><span class="small muted">Racha sin gaseosa</span><b>${racha()}</b><span class="small muted">días seguidos</span></div>
  </div>
  <div class="card stack"><h2>Peso</h2>${weightChart()}</div>
  <div class="card stack"><h2>Últimos 14 días</h2>
    <p class="small muted">✓ comí · ½ parcial · ↺ cambié · ✕ no comí · — sin registro · 🥤 sin gaseosa</p>
    <div class="tablewrap"><table class="num"><thead><tr><th>Día</th>${MEALS.map(m=>`<th>${m.n}</th>`).join('')}<th>Agua</th><th>Frutas</th><th>Activ.</th><th>Sin gas.</th><th>Peso</th><th>Glucosa</th></tr></thead><tbody>
    ${last14.slice().reverse().map(k=>{ const d=S.dias[k]; const c=(d&&d.comidas)||{}; return `<tr><td>${esc(fmtShort(k))}${d&&d.depurativo?' 🍍':''}</td>${MEALS.map(m=>`<td>${ST_SYM[(c[m.k]||{}).estado]||'—'}</td>`).join('')}<td>${d?d.agua||0:'—'}</td><td>${d?d.frutas||0:'—'}</td><td>${d?(d.actividad||0)+"'":'—'}</td><td>${d&&d.sinGaseosa?'✓':'—'}</td><td>${d&&d.peso?d.peso:'—'}</td><td>${d&&d.glucosa?d.glucosa:'—'}</td></tr>`; }).join('')}
    </tbody></table></div>
  </div>
  <div class="card stack"><h2>Reporte para tu nutricionista</h2>
    <p>Un archivo con tus datos iniciales, la tabla día por día, tu peso, notas y las fotos analizadas. Ábrelo en tu celular o PC para mostrarlo o imprimirlo.</p>
    <div class="row"><button class="btn primary" id="dl-html">Descargar reporte</button><button class="btn" id="dl-csv">Tabla para Excel</button></div>
  </div>`;
}
function reportHTML(){
  const p = S.perfil, ks = diasOrdenados();
  const rows = ks.map(k=>{ const d=S.dias[k], c=d.comidas||{}; const nc = MEALS.map(m=>c[m.k]&&c[m.k].nota?m.n+': '+c[m.k].nota:'').filter(Boolean).join(' · ');
    return `<tr><td>${esc(fmtShort(k))}${d.depurativo?' (depurativo)':''}</td>${MEALS.map(m=>`<td>${ST_SYM[(c[m.k]||{}).estado]||'—'}</td>`).join('')}<td>${d.agua||0}</td><td>${d.frutas||0}</td><td>${d.actividad||0} min ${esc(d.actTipo||'')}</td><td>${d.sinGaseosa?'✓':''}</td><td>${d.peso??''}</td><td>${d.glucosa??''}</td><td>${d.cintura??''}</td><td>${d.sueno??''}</td><td>${esc(nc)}${nc&&d.notas?' · ':''}${esc(d.notas||'')}</td></tr>`; }).join('');
  const fotos = S.fotos.slice().sort((a,b)=>a.ts-b.ts).map(f=>`<div class="f">${f.thumb?`<img src="${f.thumb}">`:''}<div><b>${esc(fmtShort(f.fecha))} ${esc(f.hora)} · ${esc((MEALS.find(m=>m.k===f.tiempo)||{}).n||'')}</b>${f.r?` (${esc(f.r.semaforo)})<br>${r0(+f.r.kcal||0)} kcal · Proteína ${r0(+f.r.proteina_g||0)} g · Carbohidratos ${r0(+f.r.carbohidratos_g||0)} g · Grasa ${r0(+f.r.grasa_g||0)} g · Fibra ${r0(+f.r.fibra_g||0)} g<br><small>${esc((f.r.alimentos||[]).map(a=>a.nombre+' '+r0(a.gramos)+' g').join(', '))}</small><br><small>${esc(f.r.resumen||'')}</small>`:'<br>Sin análisis'}</div></div>`).join('');
  const pesos = ks.filter(k=>S.dias[k].peso).map(k=>`${fmtShort(k)}: ${S.dias[k].peso} kg`).join(' · ');
  const datos = [['Peso inicial',p.pesoIni&&p.pesoIni+' kg'],['Talla',p.talla&&p.talla+' cm'],['Edad',p.edad&&p.edad+' años'],['Cintura',p.cinturaIni&&p.cinturaIni+' cm'],['HbA1c',p.hba1c&&p.hba1c+' %'],['Glucosa',p.glucosaIni&&p.glucosaIni+' mg/dL'],['Inicio',p.fechaIni]].filter(x=>x[1]).map(([a,b])=>`<div>${a}: <b>${esc(b)}</b></div>`).join('');
  return `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte Anto Nutrición${p.nombre?' · '+esc(p.nombre):''}</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;color:#11272A;max-width:1000px;margin:24px auto;padding:0 16px;font-size:13px}h1{font-size:22px;margin:0}h2{font-size:16px;margin:22px 0 8px;border-bottom:2px solid #0E7C78;padding-bottom:4px}.t{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid #CFE1DF;padding:5px;text-align:center}th{background:#E2EFED}td:first-child,td:last-child{text-align:left}.k{display:flex;gap:10px;flex-wrap:wrap}.k div{background:#E2EFED;border-radius:8px;padding:8px 12px}.f{display:flex;gap:10px;border-bottom:1px solid #CFE1DF;padding:8px 0}.f img{width:90px;height:90px;object-fit:cover;border-radius:8px}@media print{.f{break-inside:avoid}}</style></head><body>
<h1>Reporte de seguimiento nutricional</h1><p>${esc(p.nombre||'')}${p.nutri?' · Nutricionista: '+esc(p.nutri):''} · Generado el ${esc(fmtLong(iso(new Date())))}</p>
${datos?`<h2>Datos iniciales</h2><div class="k">${datos}</div>`:''}
<h2>Peso registrado</h2><p>${esc(pesos||'Sin registros de peso todavía.')}</p>
<h2>Registro diario (${ks.length} días)</h2><p>✓ comí · ½ parcial · ↺ cambié · ✕ no comí</p>
<div class="t"><table><thead><tr><th>Día</th>${MEALS.map(m=>`<th>${m.n}</th>`).join('')}<th>Agua</th><th>Frutas</th><th>Actividad</th><th>Sin gaseosa</th><th>Peso</th><th>Glucosa</th><th>Cintura</th><th>Sueño</th><th>Notas</th></tr></thead><tbody>${rows||'<tr><td colspan="16">Sin registros.</td></tr>'}</tbody></table></div>
<h2>Comidas fotografiadas (${S.fotos.length})</h2>${fotos||'<p>Sin fotos.</p>'}
<p style="margin-top:20px;color:#527175">Valores nutricionales estimados por IA a partir de fotos; son aproximados.</p></body></html>`;
}
function reportCSV(){
  const head = ['fecha','depurativo',...MEALS.map(m=>m.n),'agua_vasos','frutas','actividad_min','actividad_tipo','sin_gaseosa','peso_kg','glucosa','cintura_cm','sueno_h','hambre','animo','masticacion','notas'];
  const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  const lines = diasOrdenados().map(k=>{ const d=S.dias[k], c=d.comidas||{}; return [k, d.depurativo?'si':'', ...MEALS.map(m=>{ const s=c[m.k]||{}; return (s.estado||'')+(s.nota?' ('+s.nota+')':''); }), d.agua||0, d.frutas||0, d.actividad||0, d.actTipo||'', d.sinGaseosa?'si':'', d.peso??'', d.glucosa??'', d.cintura??'', d.sueno??'', d.hambre||'', d.animo||'', d.mast||'', d.notas||''].map(q).join(';'); });
  return '\uFEFF'+[head.map(q).join(';'), ...lines].join('\r\n');
}
$('#v-avance').addEventListener('click', e => {

const appUrl = () => location.href.split('#')[0].split('?')[0];
async function shareText(title, text){
  try { if (navigator.share){ await navigator.share({title, text}); return; } } catch(e){ if (e.name==='AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Copiado. Pégalo en WhatsApp'); } catch(e){ toast('No se pudo compartir'); }
}
$('#share').addEventListener('click', () => { buzz(); shareText('Anto Nutrición', `Te comparto Anto Nutrición: plan de comidas saludable, bebidas para dejar la gaseosa y control diario. Ábrela e instálala aquí: ${appUrl()}`); });
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('#install').hidden = false; });
$('#install').addEventListener('click', async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; $('#install').hidden = true; });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});

document.addEventListener('visibilitychange', () => { const t = iso(new Date()); if (!document.hidden && t!==S.lastToday){ S.lastToday = t; S.date = t; if (S.tab==='hoy') renderHoy(); } });
(async function start(){
  const hash = (location.hash||'').slice(1);
  let t = TABS.includes(hash) ? hash : (()=>{ try{ return localStorage.getItem('np.tab')||'hoy'; }catch(e){ return 'hoy'; } })();

  await loadFotos();

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
})();
